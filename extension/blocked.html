<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeShield — Dangerous Page Blocked</title>
    <style>
      :root {
        --bg: #07131b;
        --panel: #0d1d2a;
        --line: rgba(123, 171, 255, 0.2);
        --text: #eaf6ff;
        --muted: #a9c4d8;
        --critical: #ef4444;
        --medium: #fbbf24;
        --low: #34d399;
        --accent: #5eead4;
        --accent-strong: #38bdf8;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        background: linear-gradient(160deg, #07131b 0%, #0f0a0a 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 640px;
        background: rgba(13, 29, 42, 0.95);
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 20px;
        box-shadow: 0 0 60px rgba(239, 68, 68, 0.15), 0 20px 40px rgba(0,0,0,0.5);
        overflow: hidden;
      }

      /* ── Header ── */
      .card-header {
        padding: 28px 28px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(239, 68, 68, 0.06);
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }

      .shield-icon {
        flex-shrink: 0;
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(239,68,68,0.15));
        border: 1px solid rgba(239,68,68,0.4);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
      }

      .header-text h1 {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--critical);
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }

      .header-text p {
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.5;
      }

      /* ── Body ── */
      .card-body {
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* URL display */
      .url-block {
        background: rgba(239,68,68, 0.07);
        border: 1px solid rgba(239,68,68, 0.25);
        border-radius: 12px;
        padding: 14px 16px;
      }

      .url-block .label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .url-block .url-text {
        font-family: monospace;
        font-size: 0.82rem;
        color: var(--critical);
        word-break: break-all;
        line-height: 1.5;
      }

      /* Threat breakdown */
      .threat-block {
        background: rgba(11, 20, 28, 0.7);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .threat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }

      .threat-header .label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .score-badge {
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: rgba(239,68,68, 0.18);
        color: var(--critical);
      }

      .score-badge.medium {
        background: rgba(251,191,36, 0.18);
        color: var(--medium);
      }

      .reasons-list {
        list-style: none;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .reasons-list li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 0.82rem;
        color: var(--text);
        line-height: 1.5;
      }

      .reasons-list li::before {
        content: "▸";
        color: var(--critical);
        flex-shrink: 0;
        margin-top: 1px;
      }

      /* Buttons */
      .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn {
        padding: 13px 18px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
        letter-spacing: 0.01em;
      }

      .btn:hover { transform: translateY(-1px); opacity: 0.9; }
      .btn:active { transform: translateY(0); }

      .btn-safe {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #03161d;
      }

      .btn-bypass {
        background: rgba(148,163,184, 0.1);
        color: var(--muted);
        border: 1px solid var(--line);
        font-size: 0.78rem;
      }

      /* Brand footer */
      .card-footer {
        padding: 12px 28px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(7,19,27, 0.6);
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        font-size: 0.72rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #03161d;
      }

      .brand-footer-text {
        font-size: 0.72rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Header -->
      <div class="card-header">
        <div class="shield-icon">🛡️</div>
        <div class="header-text">
          <h1>Dangerous Page Blocked</h1>
          <p>SafeShield has intercepted this navigation. The destination has been flagged as a potential threat based on risk analysis.</p>
        </div>
      </div>

      <!-- Body -->
      <div class="card-body">
        <!-- URL -->
        <div class="url-block">
          <p class="label">Blocked URL</p>
          <p class="url-text" id="blocked-url">Loading…</p>
        </div>

        <!-- Threat breakdown -->
        <div class="threat-block">
          <div class="threat-header">
            <span class="label">Threat Breakdown</span>
            <span class="score-badge" id="score-badge">Score: —</span>
          </div>
          <ul class="reasons-list" id="reasons-list">
            <li>Analyzing threat data…</li>
          </ul>
        </div>

        <!-- Action buttons -->
        <div class="btn-row">
          <button class="btn btn-safe" id="btn-back">← Back to Safety</button>
          <button class="btn btn-bypass" id="btn-bypass">Bypass &amp; Proceed ↗</button>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <span class="brand-mark">S</span>
        <span class="brand-footer-text">SafeShield — AI Cyber Risk Assistant · CYBER-9 Active</span>
      </div>
    </div>

    <script src="blocked.js"></script>
  </body>
</html>
